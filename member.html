<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smot - Member View</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/jpeg" href="assets/smot.jpeg" />
  </head>
  <body>
    <a href="index.html" class="floating-logo-link" title="Choose Task">
      <img src="assets/smot.jpeg" alt="Smot Logo" class="floating-logo" />
    </a>
    <div class="container">
      <nav class="navbar">
        <h1>Smot Member</h1>
        <a href="member-login.html" class="btn btn-secondary">Switch User</a>
      </nav>

      <section class="section">
        <h2>Events</h2>
        <div id="eventsList" class="events-container"></div>
      </section>

      <section id="reportTypeSection" class="section hidden">
        <h2>Make a Report for: <span id="typeEventName"></span></h2>
        <p class="section-hint">
          Is this report made before the event or after the event?
        </p>
        <div class="report-type-container">
          <button type="button" class="report-type-btn before" data-type="before">
            <span class="report-type-icon">📥</span>
            <span class="report-type-title">Before the Event</span>
            <span class="report-type-desc">As what you got (items received)</span>
          </button>
          <button type="button" class="report-type-btn after" data-type="after">
            <span class="report-type-icon">📤</span>
            <span class="report-type-title">After the Event</span>
            <span class="report-type-desc">As what remains with you (leftovers)</span>
          </button>
        </div>
        <button type="button" id="backToEventsBtn" class="btn btn-secondary btn-small">
          ← Back to Events
        </button>
      </section>

      <section id="reportSection" class="section hidden">
        <h2>
          <span id="reportTypeLabel"></span> — Report for:
          <span id="selectedEventName"></span>
        </h2>
        <form id="reportForm" novalidate>
          <div id="reportItems"></div>
          <button type="submit" class="btn">Submit Report</button>
        </form>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script type="module" src="js/member.js"></script>
  </body>
</html>
