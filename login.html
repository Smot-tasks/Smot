<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smot - Admin Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/jpeg" href="assets/smot.jpeg" />
  </head>
  <body>
    <a href="index.html" class="floating-logo-link" title="Choose Task">
      <img src="assets/smot.jpeg" alt="Smot Logo" class="floating-logo" />
    </a>
    <div class="container">
      <div class="login-box">
        <h1>Smot Admin</h1>
        <h2>Login</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required />
          </div>
          <button type="submit" class="btn">Login</button>
        </form>
        <p id="error" class="error"></p>
        <a href="member-login.html" class="member-link">Member Access</a>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
