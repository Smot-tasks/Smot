<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smot - Attendance Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/jpeg" href="assets/smot.jpeg" />
  </head>
  <body>
    <a href="index.html" class="floating-logo-link" title="Choose Task">
      <img src="assets/smot.jpeg" alt="Smot Logo" class="floating-logo" />
    </a>
    <div class="container">
      <nav class="navbar">
        <div>
          <h1>Attendance Admin</h1>
          <h2 id="adminGreeting" style="margin: 0; font-size: 1.2rem; font-weight: 400;"></h2>
        </div>
        <div>
          <a href="task2-member.html" class="btn" style="margin-right: 10px">Member View</a>
          <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
      </nav>

      <!-- Manage Members Section -->
      <section class="section" id="membersSection">
        <h2>Manage Members</h2>
        <form id="memberForm">
          <div class="form-group">
            <label for="memberName">Member Name:</label>
            <input type="text" id="memberName" required placeholder="Enter member name" />
          </div>
          <button type="submit" class="btn">Add Member</button>
        </form>
        <p id="memberFormStatus" class="form-status" role="status"></p>
        <div id="membersList" style="margin-top: 20px;"></div>
      </section>

      <!-- Events Section -->
      <section class="section">
        <h2>Events</h2>
        <div id="eventsList" class="events-container"></div>
      </section>

      <!-- Reports Section -->
      <section class="section" id="reportsSection">
        <h2>Attendance Reports</h2>
        <div id="reportsList" class="events-container"></div>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script type="module" src="js/task2-admin.js"></script>
  </body>
</html>
